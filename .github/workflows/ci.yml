name: Specter Evidence Checks

on:
  push:
  pull_request:

# Untrusted PR code receives only read access. Attestation write stays isolated.
permissions:
  contents: read

jobs:
  node-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact Git tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Validate JS syntax
        run: npm run check
      - name: Run deterministic unit/integration tests and capture TAP
        run: |
          mkdir -p out/ci
          if ! node --test --test-reporter=tap "test/*.test.mjs" > out/ci/test.tap; then
            echo "Test suite failed; showing bounded TAP failure diagnostics."
            grep -n -A 50 '^not ok ' out/ci/test.tap | head -n 180 || true
            tail -n 12 out/ci/test.tap
            exit 1
          fi
      - name: Create bounded self-reported CI receipt
        run: node scripts/build-ci-receipt.mjs
      - name: Upload immutable-by-run receipt for review
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: specter-ci-evidence
          path: |
            out/ci/receipt.json
            out/ci/test.tap
          if-no-files-found: error
          retention-days: 30

  # This job executes only pinned GitHub actions, never checks out user code.
  attest-ci-receipt:
    if: github.event_name == 'push'
    needs: node-verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download receipt from successful read-only test job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: specter-ci-evidence
          path: out/ci
      - name: Generate signed GitHub provenance for receipt JSON
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: out/ci/receipt.json
